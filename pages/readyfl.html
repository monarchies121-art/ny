<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family New Year Card</title>
  <link rel="stylesheet" href="../css/ny.css">
  <style>
    .button-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
      position: relative;
      min-height: 80px;
    }

    #noBtn {
      position: relative;
      transition: transform 0.2s ease;
    }

    .arrow-indicator {
      display: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: #ffd700;
      animation: bounceArrow 0.6s infinite alternate;
      margin-right: 10px;
    }

    @keyframes bounceArrow {
      from { transform: translateX(0); }
      to { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="card-header">
        <h1>✨ Happy New Year, <span id="displayName">Family</span>! ✨</h1>
        <p>Are you ready for the wonderful blessings coming our way this year?</p>
      </div>

      <div class="button-group" id="btnGroup">
        <span id="arrowIndicator" class="arrow-indicator">👉</span>
        <button id="yesBtn">Yes! 🎉</button>
        <button id="noBtn">No 😢</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Retrieve stored user name
      const userName = localStorage.getItem('nyCard_userName') || 'Family';
      document.getElementById('displayName').textContent = userName;

      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const arrowIndicator = document.getElementById('arrowIndicator');
      let noPressCount = 0;

      // Yes button redirects immediately
      yesBtn.addEventListener('click', () => {
        window.location.href = 'page2FL.html';
      });

      // No button logic
      noBtn.addEventListener('click', (e) => {
        e.preventDefault();
        noPressCount++;

        if (noPressCount < 4) {
          // Move randomly on presses 1, 2, and 3
          const randomX = (Math.random() - 0.5) * 160;
          const randomY = (Math.random() - 0.5) * 80;
          noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

          // Playful text changes
          const warningTexts = ["Are you sure?", "Think again!", "Really? 🥺"];
          noBtn.textContent = warningTexts[noPressCount - 1];
        } else {
          // 4th press: Disappear and turn into an arrow pointing to Yes, then redirect
          noBtn.style.display = 'none';
          arrowIndicator.style.display = 'inline-block';

          // Redirect to page2FL.html after a brief moment
          setTimeout(() => {
            window.location.href = 'page2FL.html';
          }, 5000);
        }
      });
    });
  </script>
</body>
</html>
